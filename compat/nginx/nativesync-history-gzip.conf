# Include only inside the public vcp.skmt617.top HTTPS server.
# Existing application authorization, no-store and HTTP method checks remain.
location ~ ^/(?:mobile/api/conversations/[^/]+(?:/(?:baseline/[^/]+|events))?|api/v1/sync/(?:source/)?pull)/?$ {
    gzip on;
    gzip_types application/json;
    gzip_comp_level 3;
    gzip_min_length 1024;
    gzip_proxied no-store auth;
    gzip_vary on;

    # Match the public server's existing generic proxy exactly.
    proxy_pass http://127.0.0.1:6005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $newapi_connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
